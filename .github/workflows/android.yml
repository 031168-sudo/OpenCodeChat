name: Android APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Cache debug keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OpenCodeChat-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish APK to Releases
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/apk"
          cp app/build/outputs/apk/debug/app-debug.apk \
             "$RUNNER_TEMP/apk/opencode-chat-debug.apk"
          cd "$RUNNER_TEMP/apk"
          NOTES="Сборка от $(date -u '+%Y-%m-%d %H:%M UTC'), коммит ${GITHUB_SHA:0:7}"
          if gh release view build >/dev/null 2>&1; then
            gh release upload build opencode-chat-debug.apk --clobber
            gh release edit build --notes "$NOTES" --latest
          else
            gh release create build opencode-chat-debug.apk \
              --title "OpenCode — debug APK" --notes "$NOTES" --latest
          fi
          echo "APK: https://github.com/${{ github.repository }}/releases/latest/download/opencode-chat-debug.apk"
